id: Paper-SP1-Pre
name: Pre pulp preparation
short_name: prepulpprep
type: process
description: Paper and cardboard production; Pulp preparation (petrochemical)
version: 1.0.0
debug: false
constants:
  - name: PERF_SP1
    description: Performance for subprocess 1
    citation: text
    source: https://www.google.com
    value: 0.44
    units: p.u.
  - name: WASTE_SP1
    description: Waste ratio for subprocess 1
    citation: text
    source: https://www.google.com
    value: 0.04
    units: p.u.
  - name: WATERRED_SP1
    description: Water wasted ratio for subprocess 1
    citation: text
    source: https://www.google.com
    value: 0.9
    units: p.u.
  - name: EMISSION_SP1
    description: Emission ratio for subprocess 1
    citation: text
    source: https://www.google.com
    value: 0.4281
    units: p.u.
inputs:
  - name: debarked_logs_SP1
    description: Debarked logs
    value:
      - 2.5
    units: kt
    from: null
  - name: chemicals_SP1
    description: Chemicals needed in subprocess 1
    value:
      - 0.132
    units: kt
    from: null
  - name: water_SP1
    description: Water needed in subprocess 1
    value:
      - 0.0425
    units: Gl
    from: null
  - name: electrical_energy_SP1
    description: Electrical energy needed in subprocess 1
    value:
      - 3035.34
    units: GJ
    from: null
  - name: therm_energy_SP1
    description: Thermal energy needed in subprocess 1
    value:
      - 17160
    units: GJ
    from: null
outputs:
  - name: prepulp_SP1
    operation: (debarked_logs_SP1 * PERF_SP1)
    args:
      - name: debarked_logs_SP1
        type: inputs
      - name: PERF_SP1
        type: constants
    description: Prepulp generated in subprocess 1
    value: null
    units: kt
  - name: pre_waste
    operation: (debarked_logs_SP1 * WASTE_SP1)
    args:
      - name: debarked_logs_SP1
        type: inputs
      - name: WASTE_SP1
        type: constants
    description: Waste generated in subprocess 1
    value: null
    units: kt
  - name: pre_water
    operation: (water_SP1 * WATERRED_SP1)
    args:
      - name: water_SP1
        type: inputs
      - name: WATERRED_SP1
        type: constants
    description: Waste water generated in subprocess 1
    value: null
    units: Gl
  - name: pre_emi
    operation: (debarked_logs_SP1 + chemicals_SP1) * EMISSION_SP1
    args:
      - name: debarked_logs_SP1
        type: inputs
      - name: chemicals_SP1
        type: inputs
      - name: EMISSION_SP1
        type: constants
    description: Emissions generated in subprocess 1
    value: null
    units: kt
